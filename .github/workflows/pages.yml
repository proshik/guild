# The landing site: builds site/ (Hugo and the Hextra theme) and deploys it to GitHub Pages.
#
# It runs on a push to main that touches what the build reads:
#   site/**                         the site itself
#   assets/icon.svg                 the logo and the favicon, mounted from the
#                                   repository by site/hugo.yaml
#   crates/desktop/assets/fonts/**  the window's faces, mounted the same way
#   tools/get-hugo.sh               the Hugo version and its checksum
#   justfile                        the `site` recipe that builds it
#   .github/workflows/pages.yml     this workflow
# and by hand, from the Actions tab or with `gh workflow run pages.yml`.
#
# Hugo is the version tools/get-hugo.sh pins and checks against its SHA-256;
# the theme is a Hugo module pinned in site/go.mod and fetched with the go
# command. The base URL comes from actions/configure-pages, so a custom
# domain set in the repository's Pages settings needs no change here.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/icon.svg
      - crates/desktop/assets/fonts/**
      - tools/get-hugo.sh
      - justfile
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: site/go.mod
          cache: false

      - uses: extractions/setup-just@v3

      - run: ./tools/get-hugo.sh

      - id: pages
        uses: actions/configure-pages@v6

      - name: build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
        run: just site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
