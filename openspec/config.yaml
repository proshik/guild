schema: spec-driven
context: |
  Guild is a native Rust/GPUI desktop; review is provided by external revust.
  Read AGENTS.md, docs/decisions.md and docs/traps.md before changes.
  Baseline specifications describe existing contracts; active changes describe gaps.
  Desktop designs live in Penpot (docs/penpot.md); native review prototypes are retired historical references. Preserve shared Slate tokens.
  General workflow/DAG editing, a Go runtime and a new frontend are out of scope.
  Documentation, comments and commits are English; user communication is Russian.
  Use existing Guild commands and preserve caller identity. Never bypass task provenance.
  No paid calls, push, merge or publication merely because a specification exists.
  OpenCode task sessions are supported; external review executors are outside Guild.
rules:
  proposal:
    - Name non-goals, affected capabilities and authorization boundaries.
  design:
    - Distinguish implemented behavior, proposed behavior and validation evidence.
    - Cite design artboards for visible changes and preserve headless session boundaries.
  specs:
    - Give observable acceptance scenarios, including failure and restart behavior.
  tasks:
    - Link each implementation step to acceptance evidence and meaningful tests.
    - Leave unimplemented work unchecked; include just check before commits.
